version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: it_helpdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d it_helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: helpdesk_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/it_helpdesk
      - SECRET_KEY=supersecret_insecure_key_change_in_production_jwt_secret_token
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CONFIDENCE_THRESHOLD=0.80
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./app/ml/artifacts:/app/app/ml/artifacts

volumes:
  postgres_data:
